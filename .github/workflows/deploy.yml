# Deploys on every merge to main: builds the image on the runner and restarts the container on the VPS over SSH.
# Needs the repository secrets VPS_HOST, VPS_USER, VPS_SSH_KEY and (optional) ANTHROPIC_API_KEY on the server's .env.
name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync source to the VPS and rebuild
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$KEY" > key
          SSH="ssh -i key -o StrictHostKeyChecking=accept-new"
          rsync -az --delete --exclude node_modules --exclude .next --exclude .git -e "$SSH" ./ "$USER@$HOST:~/six-gates/"
          $SSH "$USER@$HOST" 'cd ~/six-gates && docker compose up -d --build'
